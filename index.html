            const rows = Object.entries(record)
                .filter(([, value]) => value !== null && value !== undefined && value !== "")
                .map(([label, value]) => `<tr><th>${escapeHtml(label)}</th><td>${escapeHtml(value)}</td></tr>`)
                .join("");
            return `<div class="facility-popup"><h2>${escapeHtml(title)}</h2><table>${rows}</table></div>`;
        }

        const overlayMaps = {};
        facilityLayers.forEach(layerDefinition => {
            const group = L.featureGroup();
            layerDefinition.records.forEach(record => {
                const marker = L.circleMarker([Number(record.Latitude), Number(record.Longitude)], {
                    color: "#ffffff",
                    weight: 2,
                    fillColor: layerDefinition.color,
                    fillOpacity: 0.92,
                    radius: 8
                });
                const title = record[layerDefinition.titleField] || record[Object.keys(record)[0]] || "Facility";
                marker.bindPopup(popupHtml(record, layerDefinition.titleField), { maxWidth: 650 });
                marker.bindTooltip(escapeHtml(title), { sticky: false });
                marker.addTo(group);
            });
            group.addTo(map);
            overlayMaps[`<span class="layer-dot" style="background:${layerDefinition.color}"></span>${escapeHtml(layerDefinition.name)}`] = group;
        });

        L.circle(center, {
            radius: 80467.2,
            color: "#FFFFFF",
            weight: 2,
            opacity: 0.8,
            fill: false,
            dashArray: "6,6",
            interactive: false
        }).addTo(map);

        L.circleMarker(center, {
            color: "#ffffff",
            weight: 2,
            fillColor: "#222222",
            fillOpacity: 1,
            radius: 7
        }).bindTooltip("Kansas City reference point", { sticky: true }).addTo(map);

        L.control.layers(
            { "Satellite / Aerial": satellite, "Street Map": street },
            overlayMaps,
            { position: "topright", collapsed: false, autoZIndex: true }
        ).addTo(map);
    </script>
</body>
</html>
